name: Build 落雪 iOS (unsigned IPA)

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ master, main ]    # 推送到 master/main 自动触发

jobs:
  build-ios:
    runs-on: macos-14
    env:
      CI: "true"
      NO_FLIPPER: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Force GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install CocoaPods
        run: gem install cocoapods --no-document

      - name: Install Pods
        run: cd ios && NO_FLIPPER=1 pod install --repo-update

      - name: Build unsigned archive
        run: |
          set -e
          xcodebuild             -workspace ios/LxMusicMobile.xcworkspace             -scheme LxMusicMobile             -configuration Release             -destination 'generic/platform=iOS'             -archivePath "$PWD/build/LxMusicMobile.xcarchive"             archive             CODE_SIGNING_ALLOWED=NO             CODE_SIGN_IDENTITY=""             DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/LxMusicMobile.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 -print -quit)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r "../落雪-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: luoxue-ios-unsigned
          path: 落雪-unsigned.ipa
